[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pseudo-fec"
dynamic = ["version"]
description = "Pseudonymisation et ré-identification locales de FEC (hors ligne)."
requires-python = ">=3.11"
dependencies = ["cryptography==50.0.1", "rapidfuzz==3.14.6"]

[tool.setuptools.dynamic]
version = { attr = "pseudo_fec.__version__" }

[tool.setuptools.packages.find]
include = ["pseudo_fec*"]

[tool.setuptools.package-data]
"pseudo_fec.ui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
