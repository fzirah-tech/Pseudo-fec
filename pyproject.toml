[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pseudo-fec"
version = "0.1.0"
description = "Pseudonymisation et ré-identification LOCALE de fichiers FEC (Fichier des Écritures Comptables)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
]

[project.optional-dependencies]
xlsx-input = ["pandas>=2.0"]
test = ["pytest>=7.0"]

[project.scripts]
pseudo-fec = "pseudo_fec.cli:main"

[tool.setuptools.packages.find]
include = ["pseudo_fec*"]
