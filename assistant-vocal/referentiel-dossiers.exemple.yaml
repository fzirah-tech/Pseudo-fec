# techniques de chaque outil. Sans lui, chaque demande vocale impose une
# désambiguïsation ("quel dossier ?", "quel company_id ?").
#
# Pour l'utiliser réellement :
#   1. copiez-le en `referentiel-dossiers.yaml` (exclu du suivi Git) ;
#   2. remplissez-le avec vos dossiers réels ;
#   3. joignez-le à votre Projet Claude (ou collez-le dans ses instructions).
#
# ATTENTION : le fichier rempli contient des noms de clients réels. Ce dépôt
# est PUBLIC — ne versionnez jamais la version réelle.

